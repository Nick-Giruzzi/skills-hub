# Please read the `config_README.md` file to get detailed explanation of available configurations.
lab_name: "Introduction to SCADA using Modbus and BACnet"

app:
  host: "0.0.0.0"
  port: 8888

startup:
  # Set this to false if you don't want your startup scripts to run in a workspace (only in a gamespace)
  enabled: true
  runInWorkspace: false
  scripts: 
    - startupScript.sh

required_services:
  ## Example: Ensure you can ping this host before startup scripts kick off
  # - host: example.us
  #   type: ping
  #   block_startup_scripts: true

  ## Example: Ensure you can reach this host on port 22 before startup scripts kick off
  # - host: example.us
  #   port: 22
  #   type: socket
  #   block_startup_scripts: true

  ## Example: Ensure you can complete a web request to http://example.us:8888/example. Don't wait for this to be available before startup scripts. 
  # - host: example.us
  #   port: 8888
  #   type: web
  #   path: /example
  #   block_startup_scripts: false
  
hosted_files: 
  # Set this to true if you have files that need to be hosted
  enabled: false

info_and_services:
  info_home_enabled: false
  services_home_enabled: false
  bookmarks_enabled: false
  bookmarks:
    mail: "https://box.skills.hub/"
    firewall: "https://pfsense.skills.hub/"

# services_to_log:
  ## Example: 
  #- host: '10.4.4.251'
  #  user: user
  #  password: tartans
  #  service: pump.service

  #- host: '10.4.4.250'
  #  user: user
  #  password: tartans
  #  service: update.service

grading:
  enabled: true
  grader_post: false
  manual_grading: true
  manual_grading_script: manualGradingExample.py
  cron_grading: false
  cron_grading_script: null
  cron_interval: 5
  cron_at: null
  cron_delay: 10
  cron_limit: null
  rate_limit: 0
  token_location: guestinfo
  tokens:
    GradingCheck1: "token1"
    GradingCheck2: "token2"
    GradingCheck3: "token3"

  submission: 
    method: display
    grader_url: "https://presidentscup.cisa.gov/gb/pc/"
    grader_key: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"

  # Example format of available grading types in `config_README.md`
  parts:
    GradingCheck1:
      token_name: Q1
      text: "Example question text?"
      mode: text
    GradingCheck2:
      token_name: Q2
      text: "Click button for grading."
      mode: button
    GradingCheck3:
      name: Q3
      text: "What option do you choose?"
      mode: mc
      opts:
        a: "answer1"
        b: "answer2"
        c: "answer3"


  phases: true
  phase_info:
    phase1: ["GradingCheck1"]
    phase2: ["GradingCheck2"]
    phase3: ["GradingCheck3"]
    #mini_lab: []